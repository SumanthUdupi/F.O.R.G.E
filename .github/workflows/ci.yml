name: constitution

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    # Three platforms because path handling is where this kind of tool breaks silently:
    # `new URL(import.meta.url).pathname` yields "/D:/a/repo" on Windows and every path
    # built from it misses without erroring.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # bash on every platform, including the Windows runners. The default there is
        # PowerShell, which has no /dev/null and does not expand globs -- both of which
        # this job needs, and both of which failed the first time this ran.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No `npm install`. There are no dependencies, and a lockfile step here would hide
      # the day one crept in.
      - name: the organization loads and cross-references
        run: node scripts/forge.mjs roster > /dev/null

      - name: constitutional audit
        run: node scripts/forge.mjs doctor

      - name: the build is in sync with the registry
        run: node scripts/forge.mjs build --apply && git diff --exit-code

      - name: the charter is in sync with the constitution
        run: node scripts/forge.mjs charter --apply && git diff --exit-code

      # An explicit glob, not `--test tests/`. Node 22 treats a bare directory argument as a
      # module to execute and fails with "Cannot find module .../tests"; 18 and 20 accept it.
      # The glob is the form all three agree on.
      - name: tests
        run: node --test tests/*.test.mjs

      # Routing is deterministic, so a change to roster/routing/contracts either preserves
      # these answers or it does not. This is the step that catches "I added a capability
      # family and production release stopped escalating" before a release, not during one.
      - name: golden routing replay
        run: node scripts/forge.mjs bench-routing

      # The parser under every file the organization loads is hand-rolled and cannot be
      # swapped for a library (zero dependencies is load-bearing), so it is fuzzed instead.
      # The failure this hunts is a SILENT WRONG PARSE — throwing is the parser working.
      - name: fuzz the yaml parser
        run: node scripts/yaml-fuzz.mjs --iterations 4000 --seed 42

      - name: the system reference is in sync with the system it describes
        run: node scripts/forge.mjs explain --all > docs/SYSTEM-REFERENCE.md && git diff --exit-code
