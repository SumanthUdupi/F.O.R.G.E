<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F.O.R.G.E. Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 1l9.5 5.5v11L12 23 2.5 17.5v-11z' fill='%230D8EA3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/console.css">
</head>
<body>
<div id="app" class="officeapp">
  <header class="hud">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span><b>F.O.R.G.E.</b><small id="ws-name">your organization</small></span></div>
    <button class="hudpill" id="hud-needs" data-open="reception" title="Approvals and questions waiting on you">·</button>
    <button class="hudpill" id="hud-mail" data-open="reception" title="Messages in flight">·</button>
    <button class="hudpill" id="hud-live" data-open="mission" title="Mission control — every live session and what the organization is doing">·</button>
    <span class="spacer"></span>
    <span class="hudstat" id="live">connecting…</span>
  </header>

  <main class="floorwrap">
    <canvas id="office" role="img" aria-label="The office: twelve department rooms around the board table. Every room, the board, your reception desk and the elevator are clickable — the buttons below reach the same places by keyboard."></canvas>
    <nav class="officelegend" aria-label="Walk the office by keyboard" id="legend"></nav>
  </main>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <button class="drawerclose" id="drawerclose" aria-label="Close panel">×</button>
    <div id="drawerbody"></div>
  </aside>
</div>
<script>
  window.addEventListener('unhandledrejection', (e) => {
    window.dispatchEvent(new ErrorEvent('error', { message: String(e.reason && e.reason.message || e.reason) }));
  });
  window.addEventListener('error', (e) => {
    const d = document.createElement('div');
    d.setAttribute('data-jserror', '1');
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;background:#f6e2e0;color:#b23b3b;padding:10px 14px;border-radius:10px;font:13px system-ui;z-index:9';
    d.textContent = 'Something broke on this page: ' + e.message + ' — refresh to recover.';
    document.body.appendChild(d);
  });
</script>
<script type="module" src="/console.js"></script>
<script type="module">if (new URLSearchParams(location.search).get("e2e") === "1") import("/e2e.js");</script>
</body>
</html>
