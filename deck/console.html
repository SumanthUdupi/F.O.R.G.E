<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F.O.R.G.E. Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 1l9.5 5.5v11L12 23 2.5 17.5v-11z' fill='%230D8EA3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/console.css">
</head>
<body>
<div id="app">
  <nav class="rail" aria-label="Console">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span><b>F.O.R.G.E.</b><small id="ws-name">your organization</small></span>
    </div>
    <button class="nav" data-view="home"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>Home<span class="count" id="c-home"></span></button>
    <button class="nav" data-view="chat"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-5 4V5a1 1 0 0 1 1-1z"/></svg>Chat<span class="count" id="c-chat"></span></button>
    <button class="nav" data-view="ideas"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 1 4 12.7V17a1 1 0 0 1-1 1h-6a1 1 0 0 1-1-1v-2.3A7 7 0 0 1 12 2zM9 21h6v1H9z"/></svg>Ideas</button>
    <button class="nav" data-view="repos"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v16l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>Repos to study</button>
    <button class="nav" data-view="plans"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 5h16v3H4zM4 10.5h10v3H4zM4 16h13v3H4z"/></svg>Plans</button>
    <button class="nav" data-view="team"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l8 4.5v9L12 20l-8-4.5v-9z"/></svg>The team</button>
    <button class="nav" data-view="spend"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M14 2a9 9 0 0 1 8 8h-8z"/></svg>Spending</button>
    <button class="nav" data-view="sessions"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3a9 9 0 1 1-9 9h2a7 7 0 1 0 7-7zM11 8h2v5l4 2-1 1.7-5-2.7z"/></svg>Sessions</button>
  </nav>
  <main class="stage"><div class="wrap" id="stage"><p class="empty">One moment…</p></div></main>
</div>
<script>
  // A silent freeze is the worst failure a non-technical surface can have. Any uncaught
  // error paints a plain-language banner instead of leaving a button saying "Planning…"
  // forever — which is exactly how this trap earned its place.
  // Both channels: a throw in a click handler arrives as 'error', but the same throw in
  // an async chain arrives as 'unhandledrejection' — the first version listened to one and
  // a crashed render passed in silence.
  window.addEventListener('unhandledrejection', (e) => {
    window.dispatchEvent(new ErrorEvent('error', { message: String(e.reason && e.reason.message || e.reason) }));
  });
  window.addEventListener('error', (e) => {
    const d = document.createElement('div');
    d.setAttribute('data-jserror', '1');
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;background:#f6e2e0;color:#b23b3b;padding:10px 14px;border-radius:10px;font:13px system-ui;z-index:9';
    d.textContent = 'Something broke on this page: ' + e.message + ' — refresh to recover.';
    document.body.appendChild(d);
  });
</script>
<script type="module" src="/console.js"></script>
<script type="module">if (new URLSearchParams(location.search).get("e2e") === "1") import("/e2e.js");</script>
</body>
</html>
