<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F.O.R.G.E. — Command Deck</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 1l9.5 5.5v11L12 23 2.5 17.5v-11z' fill='%2300E5FF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/deck.css">
</head>
<body>
<div id="app">
  <header class="spine">
    <div class="brand"><span class="mark"></span>F.O.R.G.E.<small id="expands"></small></div>
    <div class="stat"><span>WORKSPACE</span><b id="ws">—</b></div>
    <div class="stat"><span>OBSERVATIONS</span><b id="obs">—</b></div>
    <div class="stat"><span>CONSTITUTION</span><b id="health">—</b><span class="pulse" id="healthdot"></span></div>
    <div class="spacer"></div>
    <div class="stat"><span id="live">connecting…</span></div>
  </header>

  <div class="shell">
    <nav class="rail" id="rail">
      <div class="label">OPERATIONS</div>
      <button class="navitem" data-view="deck">Command Deck</button>
      <button class="navitem" data-view="vector">Campaign Vector</button>
      <div class="label">ORGANIZATION</div>
      <button class="navitem" data-view="board">The Board<span class="n">6</span></button>
      <button class="navitem" data-view="roster">Roster<span class="n" id="n-roster"></span></button>
      <div class="label">GOVERNANCE</div>
      <button class="navitem" data-view="learning">Learning<span class="n" id="n-prop"></span></button>
      <button class="navitem" data-view="charter">Charter<span class="n" id="n-rules"></span></button>
      <button class="navitem" data-view="audit">Audit</button>
    </nav>
    <main class="stage" id="stage"><p class="empty">Loading the organization…</p></main>
  </div>
</div>
<script type="module" src="/deck.js"></script>
</body>
</html>
